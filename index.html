<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Emotion HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header>
            <div>
                <p class="eyebrow">REAL-TIME FACIAL ANALYSIS</p>
                <h1>AI Emotion HUD</h1>
            </div>

            <span id="status" class="status offline">
                Backend offline
            </span>
        </header>

        <section class="dashboard">
            <div class="camera-panel">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="canvas"></canvas>

                <div class="scan-line"></div>
                <div class="camera-label">CAMERA FEED</div>

                <button id="startButton">
                    Start Camera
                </button>
            </div>

            <aside class="data-panel">
                <p class="label">DOMINANT EMOTION</p>
                <h2 id="emotion">Waiting...</h2>

                <p class="label">CONFIDENCE</p>
                <div class="confidence-row">
                    <span id="confidence">0%</span>
                    <div class="bar">
                        <div id="confidenceBar"></div>
                    </div>
                </div>

                <p class="label">EMOTION SCORES</p>
                <div id="scores" class="scores">
                    <p>Start the camera to begin.</p>
                </div>

                <p id="message" class="message">
                    Click “Start Camera” and allow camera access.
                </p>
            </aside>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
